<!DOCTYPE html>
<html lang="ny">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Baibulo">
<meta name="theme-color" content="#1a1410">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Baibulo — Chichewa</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* ===== TOKENS ===== */
:root {
  --bg: #f5f0e6;
  --bg-elevated: #fdfaf3;
  --bg-sidebar: #f0e9d8;
  --ink: #2a1f17;
  --ink-soft: #5c4a3a;
  --ink-faint: #8a7660;
  --accent: #8b3a1f;
  --rule: #d9cdb8;
  --highlight: #f4e4c1;
  --shadow: 0 1px 2px rgba(42,31,23,.04), 0 4px 16px rgba(42,31,23,.07);
  --shadow-panel: 0 -4px 32px rgba(42,31,23,.12);
  --serif: 'Cormorant Garamond', Georgia, serif;
  --sans: 'Inter', -apple-system, system-ui, sans-serif;
  --font-size: 19px;
  --line-height: 1.78;
  --sidebar-w: 300px;
  --topbar-h: 56px;
}

[data-theme="dark"] {
  --bg: #1a1410;
  --bg-elevated: #221b15;
  --bg-sidebar: #1e1710;
  --ink: #ede4d3;
  --ink-soft: #b8a890;
  --ink-faint: #7a6b58;
  --accent: #d49060;
  --rule: #3a2e24;
  --highlight: #4a3520;
  --shadow: 0 1px 2px rgba(0,0,0,.2), 0 4px 16px rgba(0,0,0,.4);
  --shadow-panel: 0 -4px 32px rgba(0,0,0,.4);
}

[data-theme="sepia"] {
  --bg: #ede0c4;
  --bg-elevated: #f5ead0;
  --bg-sidebar: #e6d8bc;
  --ink: #3a2817;
  --ink-soft: #6b5439;
  --ink-faint: #8f7858;
  --accent: #7a3318;
  --rule: #c9b894;
  --highlight: #e8d49a;
}

/* ===== RESET ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overscroll-behavior: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }

body {
  font-family: var(--serif);
  background: var(--bg);
  color: var(--ink);
  font-size: var(--font-size);
  line-height: var(--line-height);
  transition: background 0.3s, color 0.3s;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  height: 100dvh;
}

body[data-size="small"]  { --font-size: 17px; }
body[data-size="medium"] { --font-size: 19px; }
body[data-size="large"]  { --font-size: 22px; }
body[data-size="xlarge"] { --font-size: 25px; }

/* ===== LAYOUT SHELL ===== */
.shell {
  display: flex;
  height: 100dvh;
  overflow: hidden;
}

/* ===== SIDEBAR (tablet/desktop only) ===== */
.sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  background: var(--bg-sidebar);
  border-right: 1px solid var(--rule);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sidebar-head {
  padding: 20px 20px 12px;
  border-bottom: 1px solid var(--rule);
  flex-shrink: 0;
}

.sidebar-logo {
  font-family: var(--serif);
  font-style: italic;
  font-size: 28px;
  font-weight: 500;
  color: var(--accent);
  display: block;
  margin-bottom: 2px;
}

.sidebar-sub {
  font-family: var(--sans);
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ink-faint);
}

.sidebar-scroll {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 20px;
}

.sidebar-scroll::-webkit-scrollbar { width: 4px; }
.sidebar-scroll::-webkit-scrollbar-track { background: transparent; }
.sidebar-scroll::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 2px; }

.sidebar-section {
  padding: 16px 20px 6px;
  font-family: var(--sans);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--ink-faint);
  border-bottom: 1px solid var(--rule);
  margin-bottom: 4px;
}

.sidebar-book {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 20px;
  cursor: pointer;
  transition: background 0.12s;
  border-radius: 0;
}

.sidebar-book:hover { background: var(--bg-elevated); }
.sidebar-book.active { background: var(--accent); }
.sidebar-book.active .sidebar-book-name,
.sidebar-book.active .sidebar-book-ch { color: var(--bg); }

.sidebar-book.locked { opacity: 0.38; cursor: not-allowed; }
.sidebar-book.locked:hover { background: transparent; }

.sidebar-book-name {
  font-family: var(--serif);
  font-size: 18px;
  font-weight: 500;
  color: var(--ink);
}

.sidebar-book-ch {
  font-family: var(--sans);
  font-size: 10px;
  color: var(--ink-faint);
}

/* ===== MAIN PANEL ===== */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}

/* ===== TOPBAR ===== */
.topbar {
  height: var(--topbar-h);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  padding-top: env(safe-area-inset-top);
  border-bottom: 1px solid var(--rule);
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  position: relative;
  z-index: 10;
}

.topbar-title {
  font-family: var(--serif);
  font-style: italic;
  font-size: 20px;
  font-weight: 500;
  color: var(--accent);
  flex: 1;
  text-align: center;
  /* On tablet+, the sidebar shows the logo so title shows current location */
}

.icon-btn {
  color: var(--ink-soft);
  padding: 8px;
  border-radius: 8px;
  transition: background 0.15s, color 0.15s;
  min-width: 40px;
  min-height: 40px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.icon-btn:active, .icon-btn:hover { background: var(--rule); color: var(--ink); }
.icon-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ===== CONTENT SCROLL AREA ===== */
.content {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding-bottom: calc(env(safe-area-inset-bottom) + 32px);
}

.content::-webkit-scrollbar { width: 5px; }
.content::-webkit-scrollbar-track { background: transparent; }
.content::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 2px; }

/* ===== HOME VIEW (mobile only — tablet uses sidebar) ===== */
.home-view {
  max-width: 600px;
  margin: 0 auto;
  padding: 28px 22px 48px;
}

.welcome {
  text-align: center;
  padding: 28px 0 36px;
  border-bottom: 1px solid var(--rule);
  margin-bottom: 28px;
}

.welcome h1 {
  font-family: var(--serif);
  font-style: italic;
  font-weight: 500;
  font-size: 52px;
  color: var(--accent);
  margin-bottom: 6px;
}

.welcome .sub {
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ink-faint);
}

.continue-reading {
  background: var(--bg-elevated);
  border: 1px solid var(--rule);
  border-left: 3px solid var(--accent);
  padding: 14px 18px;
  border-radius: 10px;
  margin-bottom: 24px;
  cursor: pointer;
  transition: background 0.15s;
}
.continue-reading:active { background: var(--rule); }
.continue-label {
  font-family: var(--sans);
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin-bottom: 4px;
}
.continue-ref {
  font-family: var(--serif);
  font-style: italic;
  font-size: 22px;
  color: var(--accent);
}

.section-label {
  font-family: var(--sans);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin: 24px 0 10px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--rule);
}

.book-list { list-style: none; }

.book-item {
  padding: 14px 4px;
  border-bottom: 1px solid var(--rule);
  cursor: pointer;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  transition: padding 0.12s, background 0.12s;
}
.book-item:active { background: var(--bg-elevated); padding-left: 10px; }
.book-item.locked { opacity: 0.4; cursor: not-allowed; }
.book-item.locked:active { background: transparent; padding-left: 4px; }

.book-name {
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 500;
  color: var(--ink);
}
.book-meta {
  font-family: var(--sans);
  font-size: 10px;
  color: var(--ink-faint);
  letter-spacing: 0.05em;
  text-transform: uppercase;
  white-space: nowrap;
}

/* ===== CHAPTER GRID ===== */
.chapter-view {
  max-width: 560px;
  margin: 0 auto;
  padding: 28px 22px 48px;
}

.chapter-header {
  text-align: center;
  margin-bottom: 28px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--rule);
}

.chapter-header .book-title-en {
  font-family: var(--sans);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin-bottom: 6px;
}

.chapter-header .book-title-ny {
  font-family: var(--serif);
  font-style: italic;
  font-size: 42px;
  font-weight: 500;
  color: var(--accent);
  line-height: 1;
}

.chapter-header .choose-label {
  font-family: var(--sans);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin-top: 8px;
}

.chapter-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
  gap: 8px;
}

.chapter-cell {
  aspect-ratio: 1;
  border: 1px solid var(--rule);
  background: var(--bg-elevated);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--serif);
  font-size: 20px;
  color: var(--ink);
  cursor: pointer;
  transition: all 0.12s;
}
.chapter-cell:hover { border-color: var(--accent); color: var(--accent); }
.chapter-cell:active { background: var(--accent); color: var(--bg); border-color: var(--accent); transform: scale(0.94); }

/* ===== READER ===== */
.reader-view {
  max-width: 680px;
  margin: 0 auto;
  padding: 28px 24px 64px;
}

/* Wider on tablet */
@media (min-width: 768px) {
  .reader-view { padding: 36px 48px 80px; }
}

.reader-header {
  text-align: center;
  margin-bottom: 32px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--rule);
}

.reader-book-name {
  font-family: var(--sans);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin-bottom: 8px;
}

.reader-chapter-num {
  font-family: var(--serif);
  font-style: italic;
  font-size: 72px;
  font-weight: 500;
  color: var(--accent);
  line-height: 1;
}

.reader-chapter-label {
  font-family: var(--sans);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin-top: 6px;
}

.verse {
  margin-bottom: 0.55em;
  padding: 4px 6px;
  border-radius: 5px;
  cursor: pointer;
  transition: background 0.15s;
  position: relative;
}
.verse:hover { background: color-mix(in srgb, var(--highlight) 50%, transparent); }
.verse.highlighted { background: var(--highlight); }

.verse-num {
  font-family: var(--sans);
  font-size: 0.58em;
  font-weight: 600;
  color: var(--accent);
  vertical-align: super;
  margin-right: 4px;
  letter-spacing: 0.02em;
  opacity: 0.8;
}

.verse-text { color: var(--ink); }

.loading-text {
  text-align: center;
  padding: 80px 20px;
  color: var(--ink-faint);
  font-style: italic;
  font-size: 18px;
}

.coming-soon {
  text-align: center;
  padding: 60px 20px;
  color: var(--ink-faint);
  font-style: italic;
}

/* ===== CHAPTER NAV ===== */
.chapter-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 52px;
  padding-top: 24px;
  border-top: 1px solid var(--rule);
  gap: 12px;
}

.nav-btn {
  background: var(--bg-elevated);
  border: 1px solid var(--rule);
  color: var(--ink-soft);
  padding: 12px 20px;
  border-radius: 10px;
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 500;
  flex: 1;
  max-width: 160px;
  min-height: 44px;
  transition: all 0.12s;
}
.nav-btn:hover { border-color: var(--accent); color: var(--accent); }
.nav-btn:active { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.nav-btn:disabled { opacity: 0.25; cursor: not-allowed; }
.nav-btn.prev { text-align: left; }
.nav-btn.next { text-align: right; }

/* ===== SETTINGS PANEL ===== */
.panel-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  z-index: 200;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
}
.panel-overlay.open { opacity: 1; pointer-events: auto; }

.settings-panel {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-elevated);
  border-radius: 20px 20px 0 0;
  padding: 20px 24px calc(24px + env(safe-area-inset-bottom));
  z-index: 201;
  transform: translateY(100%);
  transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
  box-shadow: var(--shadow-panel);
  max-width: 560px;
  margin: 0 auto;
}

@media (min-width: 560px) {
  .settings-panel {
    left: 50%;
    right: auto;
    transform: translateX(-50%) translateY(100%);
    width: 520px;
    border-radius: 20px 20px 0 0;
  }
  .settings-panel.open {
    transform: translateX(-50%) translateY(0);
  }
}

.settings-panel.open { transform: translateY(0); }

.panel-handle {
  width: 36px;
  height: 4px;
  background: var(--rule);
  border-radius: 2px;
  margin: 0 auto 18px;
}

.panel-title {
  font-family: var(--serif);
  font-style: italic;
  font-size: 24px;
  color: var(--accent);
  text-align: center;
  margin-bottom: 20px;
}

.setting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 0;
  border-bottom: 1px solid var(--rule);
  gap: 12px;
}
.setting-row:last-child { border-bottom: none; }

.setting-label {
  font-family: var(--sans);
  font-size: 14px;
  font-weight: 500;
  color: var(--ink);
}

.btn-group { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

.theme-btn, .size-btn {
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 500;
  padding: 8px 14px;
  border: 1px solid var(--rule);
  background: var(--bg);
  color: var(--ink-soft);
  border-radius: 8px;
  min-height: 36px;
  transition: all 0.12s;
}
.theme-btn:hover, .size-btn:hover { border-color: var(--accent); color: var(--accent); }
.theme-btn.active, .size-btn.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }

.setting-hint {
  font-family: var(--sans);
  font-size: 11px;
  color: var(--ink-faint);
  margin-top: 2px;
}

.update-btn {
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 600;
  padding: 10px 18px;
  background: var(--accent);
  color: var(--bg);
  border-radius: 8px;
  min-height: 40px;
  transition: opacity 0.15s;
  white-space: nowrap;
}
.update-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* ===== VERSE ACTIONS BAR ===== */
.verse-actions {
  position: fixed;
  left: 50%;
  bottom: -100px;
  transform: translateX(-50%);
  background: var(--bg-elevated);
  border: 1px solid var(--rule);
  border-radius: 14px;
  padding: 6px;
  display: flex;
  gap: 2px;
  z-index: 150;
  box-shadow: var(--shadow);
  transition: bottom 0.25s cubic-bezier(0.32, 0.72, 0, 1);
  white-space: nowrap;
}
.verse-actions.open { bottom: calc(16px + env(safe-area-inset-bottom)); }

.action-btn {
  padding: 10px 16px;
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-soft);
  border-radius: 9px;
  min-height: 40px;
  transition: background 0.12s, color 0.12s;
}
.action-btn:hover { background: var(--bg); color: var(--ink); }
.action-btn:active { background: var(--rule); }
.action-btn.danger { color: var(--accent); }

/* ===== ANIMATIONS ===== */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
.view-anim { animation: fadeUp 0.25s ease; }

/* ===== RESPONSIVE BREAKPOINTS ===== */

/* Phone: single-panel, sidebar hidden */
@media (max-width: 767px) {
  .sidebar { display: none; }
  .topbar { padding-top: calc(env(safe-area-inset-top) + 0px); height: calc(var(--topbar-h) + env(safe-area-inset-top)); }
}

/* Tablet & Desktop: sidebar visible, topbar back-btn hidden */
@media (min-width: 768px) {
  .sidebar { display: flex; }
  #back-btn { display: none; }
  .topbar-title { text-align: left; }
  .chapter-grid { grid-template-columns: repeat(auto-fill, minmax(68px, 1fr)); }
}

/* Large desktop: wider sidebar */
@media (min-width: 1200px) {
  :root { --sidebar-w: 340px; }
}
</style>
</head>
<body>

<div class="shell">

  <!-- SIDEBAR (tablet/desktop) -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <span class="sidebar-logo">Baibulo</span>
      <span class="sidebar-sub">M'Chichewa</span>
    </div>
    <div class="sidebar-scroll" id="sidebar-scroll">
      <!-- populated by JS -->
    </div>
  </aside>

  <!-- MAIN PANEL -->
  <div class="main">

    <!-- TOP BAR -->
    <div class="topbar">
      <button class="icon-btn" id="back-btn" aria-label="Back" style="visibility:hidden;">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="topbar-title" id="topbar-title">Baibulo</div>
      <button class="icon-btn" id="settings-btn" aria-label="Zosintha">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>

    <!-- SCROLLABLE CONTENT -->
    <div class="content" id="content">
      <!-- populated by JS -->
    </div>

  </div><!-- /main -->
</div><!-- /shell -->

<!-- SETTINGS PANEL -->
<div class="panel-overlay" id="panel-overlay"></div>
<div class="settings-panel" id="settings-panel">
  <div class="panel-handle"></div>
  <div class="panel-title">Zosintha</div>

  <div class="setting-row">
    <span class="setting-label">Mtundu</span>
    <div class="btn-group">
      <button class="theme-btn" data-theme="light">Kuwala</button>
      <button class="theme-btn" data-theme="sepia">Sepia</button>
      <button class="theme-btn" data-theme="dark">Mdima</button>
    </div>
  </div>

  <div class="setting-row">
    <span class="setting-label">Kukula kwa Mawu</span>
    <div class="btn-group">
